services:
  postgres:
    image: postgres:16-alpine
    container_name: tshirt_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tshirt_db
    volumes:
      - tshirt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tshirt_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tshirt_redis
    restart: unless-stopped
    # Append-only file: the periodic snapshot alone loses the last minutes (admin sessions,
    # queued events) when Docker is stopped abruptly
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - tshirt_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The Medusa backend as an image. Off by default (day-to-day development runs it with
  # `pnpm dev`); start it with `docker compose --profile backend up -d backend`.
  # Settings come from tshirt-backend/.env.production, which is not committed.
  backend:
    profiles: ["backend"]
    build:
      context: ./tshirt-backend
      secrets:
        - github_token
    container_name: tshirt_backend
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - ./tshirt-backend/.env.production
    environment:
      NODE_ENV: production
      # Medusa insists on SSL in production; this Postgres container has none, so it is switched off for the link
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tshirt_db?sslmode=disable
      REDIS_URL: redis://redis:6379
      RENDER_SERVICE_URL: http://render:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      render:
        condition: service_started

  # Internal preview renderer: reachable from this machine only
  render:
    build: ./tshirt-render
    container_name: tshirt_render
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      RENDER_API_KEY: ${RENDER_API_KEY:-}
    volumes:
      - tshirt_renderdata:/data

secrets:
  github_token:
    environment: GITHUB_TOKEN

volumes:
  tshirt_pgdata:
  tshirt_redisdata:
  tshirt_renderdata:
